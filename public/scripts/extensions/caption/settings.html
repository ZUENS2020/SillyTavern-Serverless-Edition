<div class="caption_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Image Captioning</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="info-block hint">Uses only the configured AI Gateway <code>caption</code> capability. Images are sent directly for inference and saved to R2 only when you send them.</div>
            <label for="caption_prompt">Caption prompt</label>
            <textarea id="caption_prompt" class="text_pole textarea_compact" rows="2">{{PROMPT_DEFAULT}}</textarea>
            <label for="caption_template">Message template (<code>{{caption}}</code>)</label>
            <textarea id="caption_template" class="text_pole textarea_compact" rows="2">{{TEMPLATE_DEFAULT}}</textarea>
            <label class="checkbox_label"><input id="caption_auto_mode" type="checkbox">Automatically caption attached images</label>
            <label class="checkbox_label"><input id="caption_refine_mode" type="checkbox">Edit captions before saving</label>
            <label class="checkbox_label"><input id="caption_show_in_chat" type="checkbox">Show image inline</label>
        </div>
    </div>
</div>
