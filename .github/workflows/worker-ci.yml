name: Worker CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:security
      - run: npm run lint
      - run: npm run check:worker
      - run: npm run test:worker
      - run: npm run check:worker-policy
      - run: npm run check:extension-policy
      - run: npm run check:browser-deps
      - run: npm run audit:routes
      - run: npm run check:access-config
      - run: npm run build
      - run: npm run cf:dry-run

  deploy:
    needs: verify
    if: github.repository == 'ZUENS2020/SillyTavern-Serverless-Edition' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://sillytavern.zuens2020.work
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: d1 migrations apply sillytavern-serverless-db --remote
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: deploy
